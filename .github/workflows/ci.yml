name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAC_VERSION: 0.37.12
  # sha256 of jac-0.37.12-linux-x86_64 from the v0.37.12 release assets.
  JAC_SHA256: 078e0b51556cef698faa43bc080cfeb52e0e316fa7b0771afa1cf8990911712a

jobs:
  # The unit and property tests take about 30 minutes in one job, so three jobs share them
  # while a fourth checks, builds, and runs the end-to-end suite.
  test:
    name: Test (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup-jac
        with:
          jac-version: ${{ env.JAC_VERSION }}
          jac-sha256: ${{ env.JAC_SHA256 }}
          compile-cache: test-${{ matrix.part }}

      # Every third test file in sorted order, so a folder of slow tests spreads over all
      # three parts and every file runs exactly once.
      - name: Test
        env:
          PART: ${{ matrix.part }}
        run: |
          jac test --collect_only | grep '\.jac$' | sort > "$RUNNER_TEMP/all-tests.txt"
          awk -v part="$PART" 'NR % 3 == part % 3' "$RUNNER_TEMP/all-tests.txt" > "$RUNNER_TEMP/part-tests.txt"
          echo "Part $PART runs $(wc -l < "$RUNNER_TEMP/part-tests.txt") of $(wc -l < "$RUNNER_TEMP/all-tests.txt") test files."
          xargs jac test < "$RUNNER_TEMP/part-tests.txt"

      - name: Keep the compiled modules
        if: always() && steps.setup.outputs.compile-cache-key != '' && steps.setup.outputs.compile-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .jac/cache
          key: ${{ steps.setup.outputs.compile-cache-key }}

  # With its compile cache restored the build takes a few minutes; a cold one (a new Jac
  # release, or a cache GitHub evicted) takes about 21, so the limit leaves room for that.
  check:
    name: Check, build, boot, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup-jac
        with:
          jac-version: ${{ env.JAC_VERSION }}
          jac-sha256: ${{ env.JAC_SHA256 }}
          compile-cache: check

      - name: Type-check and lint
        run: jac check .

      - name: Build
        run: jac build

      - name: Keep the compiled modules
        if: always() && steps.setup.outputs.compile-cache-key != '' && steps.setup.outputs.compile-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .jac/cache
          key: ${{ steps.setup.outputs.compile-cache-key }}

      # The demo history gives the end-to-end check pages with data. This server is this job's
      # alone; TRADING_AGENT_DEMO is never set on a deployed one. The fake providers let the
      # policy assistant's whole path run with no key and no network.
      - name: Boot the production build
        env:
          TRADING_AGENT_DEMO: "1"
          TRADING_AGENT_DISABLE_ORDERS: "1"
          ADMIN_PASSWORD: e2e-admin-password
          OPENROUTER_API_KEY: e2e-fake
          OPENROUTER_API_BASE: http://127.0.0.1:8399
          ALPACA_BASE_URL: http://127.0.0.1:8399
          FINNHUB_BASE_URL: http://127.0.0.1:8399
          PARALLAX_KEYS_SECRET: e2e-keys-secret-that-is-long-enough-to-use
          PARALLAX_MAX_AGENTS: "1000"
        run: |
          node e2e/fake-providers.js > fake-providers.log 2>&1 &
          jac run dist/trading-agent.jab < /dev/null > server.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://localhost:8000/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          health=$(curl -sf -X POST http://localhost:8000/function/health \
            -H 'Content-Type: application/json' -d '{}')
          echo "$health" | grep -q '"status": "ok"'
          # This server is a demo that can send no order, and it says so.
          echo "$health" | grep -q '"demo": true'
          echo "$health" | grep -q '"orders": "off"'
          curl -sf http://localhost:8000/ | grep -q '<title>Parallax</title>'
          echo "Server booted and answered."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.OS_RELEASE }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Check every page on each device
        working-directory: e2e
        env:
          E2E_ADMIN_PASSWORD: e2e-admin-password
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test

      - name: Keep the browser report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Server log
        if: always()
        run: cat server.log 2>/dev/null || true
