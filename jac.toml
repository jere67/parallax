[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-agent system that researches S&P 500 stocks and trades them on Alpaca paper accounts."
entry-point = "main"
kind = "web-app"
jac-version = "==0.39.2"

[dependencies.pypi]
# Collectors call data sources directly (research/collector.jac).
httpx = ">=0.28,<1"
# The risk gate's property tests (action/gate_tests.jac, TDD §14). A regular dependency, since
# a plain `jac install` skips [dev-dependencies] and `jac install --dev` fails to build
# watchdog on macOS with Python 3.14.
hypothesis = ">=6.100,<7"
# Seals each user's API keys at rest (accounts/vault.jac).
cryptography = ">=44,<47"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
lightweight-charts = "^5.2.0"
lucide-react = "^1.60.0"
"@fontsource-variable/instrument-sans" = "^5.2.0"
"@fontsource/instrument-serif" = "^5.2.0"
"@fontsource-variable/jetbrains-mono" = "^5.2.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
tailwindcss = "^4.3.0"
"@tailwindcss/vite" = "^4.3.0"

[client.vite]
# Tailwind v4 through its Vite plugin; dashboard/theme.css is the whole entry stylesheet.
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[dev-dependencies.pypi]
watchdog = ">=3.0.0"

[placement]
default = "server"

[placement.pins]
# Nothing here imports Python directly, so inference would pull it toward the client along the
# endpoints' references. These read the graph and hold the hard limits, so they stay server.
"policy.*" = "server"
"run.manual.*" = "server"


[byllm.model]
default_model = "openrouter/nvidia/nemotron-3.5-super-vl:free"

[byllm.call_params]
temperature = 0.2
max_output_retries = 1

[check.lint]
select = ["all"]
# Since 0.38 "all" also strips comments and docstrings and moves bodies into impls. The
# comments and docstrings here are the documentation, and bodies stay beside their declarations.
ignore = ["separate-impls", "strip-comments", "strip-docstrings"]

[scale.scheduler]
# Install-time capability: run `jac install` after changing it. Runs the morning job
# (run/jobs.jac) inside the server process.
enabled = true

[serve.workers]
# One process. Since Jac 0.38 an unset count forks one worker per core, and each would keep its own
# copy of the module globals this app relies on: the model rate limiter, the run guards, and the
# caches. tests/config_tests.jac fails if this changes.
count = "1"

[scale.admin]
# Unset, the server mints a one-time admin password and prints it in its log once. Set, it must
# meet the password policy: 8 or more characters, not a common password, and not containing "admin".
default_password = "${ADMIN_PASSWORD:-}"

[client.app_meta_data]
title = "Parallax"
description = "An AI investment committee that researches S&P 500 stocks and trades on paper. An educational project; not investment advice."
icon = "/static/assets/favicon.svg"
theme_color = "#0c0b09"
viewport = "width=device-width, initial-scale=1, viewport-fit=cover"
manifest = "/manifest.json"
apple_touch_icon = "/apple-touch-icon.png"
meta_apple_mobile_web_app_capable = "yes"
meta_mobile_web_app_capable = "yes"
meta_apple_mobile_web_app_status_bar_style = "black-translucent"
meta_apple_mobile_web_app_title = "Parallax"

[test]
directory = "."
