[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-agent system that researches S&P 500 stocks and trades them on Alpaca paper accounts."
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.12"

[dependencies]
# Collectors call data sources directly (research/collector.jac).
httpx = ">=0.28,<1"
# The risk gate's property tests (action/gate_tests.jac, TDD §14). A regular dependency, since
# a plain `jac install` skips [dev-dependencies] and `jac install --dev` fails to build
# watchdog on macOS with Python 3.14.
hypothesis = ">=6.100,<7"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
lightweight-charts = "^5.2.0"
lucide-react = "^1.60.0"
"@fontsource-variable/inter" = "^5.2.0"
"@fontsource-variable/jetbrains-mono" = "^5.2.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
tailwindcss = "^4.3.0"
"@tailwindcss/vite" = "^4.3.0"

[client.vite]
# Tailwind v4 through its Vite plugin; dashboard/theme.css is the whole entry stylesheet.
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[dev-dependencies]
watchdog = ">=3.0.0"

[placement]
default = "server"

[byllm.model]
default_model = "openrouter/nvidia/nemotron-3-super-120b-a12b:free"

[byllm.call_params]
temperature = 0.2
max_output_retries = 1

[check.lint]
select = ["all"]

[scale.scheduler]
# Install-time capability: run `jac install` after changing it. Runs the morning job
# (run/jobs.jac) inside the server process.
enabled = true

[scale.admin]
default_password = "${ADMIN_PASSWORD:-changeme}"

[client.app_meta_data]
title = "Trading Agent"
description = "An AI investment committee that researches S&P 500 stocks and trades on paper. An educational project; not investment advice."
icon = "/static/assets/favicon.svg"
theme_color = "#0b0d10"

[test]
directory = "."
